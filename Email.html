<!DOCTYPE html>
<html>
<head>
    <title>Email Template</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial;
            background-color: #f4f4f4;
        }

        .email-container {
            max-width: 600px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        .header {
            background: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .content {
            padding: 20px;
            color: #333;
        }

        .content h2 {
            color: #4CAF50;
        }

        .button {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 10px;
        }

        .footer {
            text-align: center;
            padding: 15px;
            font-size: 12px;
            color: gray;
            background: #f9f9f9;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .email-container {
                width: 95%;
            }

            .content {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="email-container">

        <!-- HEADER -->
        <div class="header">
            <h1>Welcome to Our Service</h1>
        </div>

        <!-- CONTENT -->
        <div class="content">
            <h2>Hello User 👋</h2>

            <p>
                Thank you for joining our platform. We are excited to have you with us.
                This email template is designed to be simple, clean, and easy to read.
            </p>

            <p>
                You can explore our features and get started right away.
            </p>

            <a href="#" class="button">Get Started</a>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            © 2026 Your Company | All rights reserved
        </div>

    </div>

</body>
</html>
