<!DOCTYPE html>
<html>
<head>
    <title>Signup Page</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        .note {
            font-size: 12px;
            text-align: center;
            color: gray;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Create Account</h2>

        <input type="text" placeholder="Enter Name">
        <input type="number" placeholder="Enter Age">
        <input type="text" placeholder="Enter Location">
        <input type="password" placeholder="Create Password">
        <input type="password" placeholder="Confirm Password">

        <button>Sign Up</button>

        <div class="note">
            Simple & Secure Signup Flow
        </div>

    </div>

</body>
</html>
