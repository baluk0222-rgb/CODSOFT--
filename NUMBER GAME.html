<!DOCTYPE html>
<html>
<head>
  <title>Guess Number Game</title>

  <style>

    body{
      font-family:Arial;
      text-align:center;
      background:#f2f2f2;
    }

    .box{
      width:300px;
      background:white;
      margin:50px auto;
      padding:20px;
      border-radius:10px;
    }

    input,button{
      width:100%;
      padding:10px;
      margin-top:10px;
    }

    h2{
      color:blue;
    }

  </style>
</head>

<body>

  <div class="box">

    <h2>Guess The Number</h2>

    <p>Guess number between 1 to 100</p>

    <input type="number" id="guess">

    <button onclick="checkGuess()">
      Check
    </button>

    <p id="message"></p>

    <p id="attempt"></p>

    <p id="score"></p>

  </div>

  <script>

    let randomNumber =
    Math.floor(Math.random() * 100) + 1;

    let attempts = 5;

    let score = 0;

    function checkGuess(){

      let userGuess =
      document.getElementById("guess").value;

      attempts--;

      if(userGuess == randomNumber){

        document.getElementById("message")
        .innerText = "Correct Number";

        score++;

        document.getElementById("score")
        .innerText = "Score : " + score;

      }

      else if(userGuess > randomNumber){

        document.getElementById("message")
        .innerText = "Too High";

      }

      else{

        document.getElementById("message")
        .innerText = "Too Low";

      }

      document.getElementById("attempt")
      .innerText = "Attempts Left : " + attempts;

      if(attempts == 0){

        alert("Game Over");

        randomNumber =
        Math.floor(Math.random() * 100) + 1;

        attempts = 5;

      }

    }

  </script>

</body>
</html>
